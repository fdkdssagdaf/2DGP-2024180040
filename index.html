<!doctype html>
<html lang="ko">
<head>

  <title>그림자 경계 | 제출자료</title>
  <style>

  </style>
</head>
<body>
  <main class="wrap">

      <article class="card">
        <h2>게임 기획서</h2>

        <a class="open" href="https://raw.githubusercontent.com/fdkdssagdaf/2DGP-2024180040/main/Submissions/ShadowBoundary/Shadow_Boundary_Game_Plan.pptx" download>게임 기획서 다운로드</a>

        <iframe src="https://view.officeapps.live.com/op/embed.aspx?src=https%3A%2F%2Fraw.githubusercontent.com%2Ffdkdssagdaf%2F2DGP-2024180040%2Fmain%2FSubmissions%2FShadowBoundary%2FShadow_Boundary_Presentation.pptx" title="발표자료"></iframe>
        <a class="open" href="https://raw.githubusercontent.com/fdkdssagdaf/2DGP-2024180040/main/Submissions/ShadowBoundary/Shadow_Boundary_Presentation.pptx" download>발표자료 다운로드</a>
